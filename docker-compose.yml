#Sivad - Sistema Inteligente de Validacion y extraccion de Documentos


services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama:/root/.ollama   #Conecta ollama al modelo
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
  
  sivad:
    build: .
    image: sivad:latest
    container_name: sivad
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama:
    external: true















