#Sivad - Sistema Inteligente de Validacion y extraccion de Documentos


services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama:/root/.ollama   #Conecta ollama al modelo
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped


  mongo:
    image: mongo:8.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USUARIO}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_CONTRASENA}
    volumes:
      - mongo_datos:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped

  sivad:
    build: .
    image: sivad:latest
    container_name: sivad
    environment:
      OLLAMA_URL: http://ollama:11434/api/generate
      MONGO_URL: mongodb://${MONGO_USUARIO}:${MONGO_CONTRASENA}@mongo:27017/?authSource=admin
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - mongo
    restart: unless-stopped

volumes:
  ollama:
    external: true
  mongo_datos:















